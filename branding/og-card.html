<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    html, body { margin: 0; width: 1200px; height: 630px; background: #171411; color: #f7f1e8; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; grid-template-columns: 1.2fr .8fr; align-items: center; padding: 64px 72px; box-sizing: border-box; }
    .mark { display: flex; align-items: center; gap: 14px; font-weight: 700; letter-spacing: .01em; }
    .mark img { width: 52px; height: 52px; border-radius: 12px; }
    h1 { font-family: Georgia, "Iowan Old Style", serif; font-weight: 500; font-size: 68px; line-height: .95; letter-spacing: -.04em; margin: 28px 0 18px; }
    em { color: #f28c38; font-style: italic; }
    p { margin: 0; color: #b7ada1; font-size: 24px; max-width: 640px; line-height: 1.35; }
    .thresholds { display: grid; gap: 14px; }
    .thresholds div { border: 1px solid rgba(255,255,255,.14); border-radius: 18px; padding: 18px 22px; background: #211d19; }
    strong { display: block; color: #f28c38; font-family: Georgia, serif; font-size: 36px; font-weight: 500; }
    span { color: #b7ada1; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div>
    <div class="mark"><img src="../docs/img/app-icon.png" alt=""><div>AI, Leave My Mac Alone!</div></div>
    <h1>Your AI writes the code.<br><em>The SSD stays usable.</em></h1>
    <p>Warns at 75% disk. Cleans regenerable builds and caches at 78%. Keeps trying to get back under 80%.</p>
  </div>
  <div class="thresholds">
    <div><strong>75%</strong><span>Warning</span></div>
    <div><strong>78%</strong><span>Automatic cleanup</span></div>
    <div><strong>80%</strong><span>SSD ceiling</span></div>
  </div>
</body>
</html>
